# Shift-left: run the cheap gate locally before commit. Convenience, NOT the guarantee —
# `git commit --no-verify` bypasses it, and that bypass is caught by the CI re-run. The
# wall is CI; this just gives faster feedback.
# Copy to your repo root as .pre-commit-config.yaml and run `pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: tests-accompany-code
        name: tests accompany code (augments governance)
        entry: bash governance/pre-commit/tests-accompany-code.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
