# Gate: a PR that changes implementation code must also change a test.
# Governs: test-driven-development, debugging (the OUTCOME — a fix/feature lands with a test).
# Strength: HEURISTIC — gameable with a trivial test; a real signal, not a wall.
# Customize: the TEST_RE / IMPL_RE patterns below for your stack.
name: tests-accompany-code
on:
  pull_request:
    branches: ["**"]
jobs:
  tests-accompany-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tests must accompany code
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # --- customize for your stack ---
          TEST_RE='(^|/)(tests?|__tests__|spec)/|[._-](test|spec)\.|_test\.(go|py)$|\.test\.|\.spec\.'
          IMPL_RE='\.(js|ts|jsx|tsx|py|go|rb|java|rs|php|c|cc|cpp|cs|kt|swift)$'
          changed=$(git diff --name-only "$BASE" "$HEAD")
          impl=$(echo "$changed" | grep -E "$IMPL_RE" | grep -vE "$TEST_RE" || true)
          tests=$(echo "$changed" | grep -E "$TEST_RE" || true)
          if [ -n "$impl" ] && [ -z "$tests" ]; then
            echo "::error::Implementation changed with no accompanying test change."
            echo "Impl files:"; echo "$impl" | sed 's/^/  /'
            echo "Write the test first (augments:test-driven-development). If this is genuinely"
            echo "test-exempt (pure config, a throwaway spike), note it in the PR and override."
            exit 1
          fi
          [ -z "$impl" ] && echo "ok: no implementation change." || echo "ok: tests accompany the implementation change."
