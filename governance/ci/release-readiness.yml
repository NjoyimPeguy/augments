# Gate: a release PR must update the changelog.
# Governs: release-readiness (the shippable, checkable part of the checklist).
# Strength: partial — extend with your migration-reversible / rollback-named checks.
# Trigger: a PR labeled "release" (customize to how you mark releases).
name: release-readiness
on:
  pull_request:
    types: [opened, synchronize, labeled, reopened]
jobs:
  release-readiness:
    if: contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Require a CHANGELOG entry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -qiE '(^|/)CHANGELOG(\.md)?$'; then
            echo "ok: CHANGELOG updated."
          else
            echo "::error::Release PR does not update the changelog."
            echo "Add the version entry, then extend this gate with your own pre-deploy checks"
            echo "(migration reversible, rollback named, flags set — augments:release-readiness)."
            exit 1
          fi
