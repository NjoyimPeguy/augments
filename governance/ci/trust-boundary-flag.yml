# Gate: a diff touching a trust boundary requires a security review sign-off.
# Governs: security-audits (the OUTCOME — trust-boundary changes get reviewed).
# Strength: HEURISTIC — pattern-based detection + a required label; reduces, not eliminates, the gap.
# Customize: the TRUST_RE patterns and the label name.
name: trust-boundary-flag
on:
  pull_request:
    types: [opened, synchronize, labeled, reopened]
jobs:
  trust-boundary-flag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Flag trust-boundary changes lacking a security sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          TRUST_RE='auth|login|password|passwd|secret|token|credential|crypto|jwt|session|oauth|sql|exec\(|subprocess|eval\(|deserialize|pickle|yaml\.load|cors|csrf|sanitiz|escap'
          hits=$(git diff "$BASE" "$HEAD" -- . | grep -E '^\+' | grep -iE "$TRUST_RE" || true)
          if [ -z "$hits" ]; then echo "ok: no trust-boundary patterns in the diff."; exit 0; fi
          if echo ",$LABELS," | grep -q ',security-reviewed,'; then
            echo "ok: trust-boundary change carries the 'security-reviewed' label."; exit 0
          fi
          echo "::error::This diff touches trust-boundary code but has no 'security-reviewed' label."
          echo "Run augments:security-audits (trace source->sink), then add the label. Sample hits:"
          echo "$hits" | head -5 | sed 's/^/  /'
          exit 1
